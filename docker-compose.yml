services:
  bookit-db:
    image: postgres:18
    environment:
      POSTGRES_DB: bookit_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bookit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookit_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  bookit-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      bookit-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=bookit-db;Port=5432;Database=bookit_local;Username=postgres;Password=postgres
      JwtSettings__SecretKey: ${JwtSettings__SecretKey}
      JwtSettings__Issuer: ${JwtSettings__Issuer:-BookIt.API}
      JwtSettings__Audience: ${JwtSettings__Audience:-BookIt.Client}
      JwtSettings__ExpiresInMinutes: ${JwtSettings__ExpiresInMinutes:-60}

volumes:
  bookit_postgres_data: